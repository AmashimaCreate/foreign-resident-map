name: Update foreign residents data

# 在留外国人統計は年2回（6月末・12月末、公表は約半年後）更新される。
# 取りこぼし防止のため月1で実行し、差分がある時だけコミットする。
on:
  schedule:
    - cron: "0 0 1 * *"   # 毎月1日 00:00 UTC
  workflow_dispatch:
    inputs:
      discover:
        description: "true なら getStatsList で候補statsDataIdを一覧表示（JSONは生成しない）"
        required: false
        default: "false"
      zairyu_stats_id:
        description: "在留外国人 statsDataId（空ならコード既定値を使用）"
        required: false
        default: ""
      pop_stats_id:
        description: "人口推計 statsDataId（空ならコード既定値を使用）"
        required: false
        default: ""
      query:
        description: "discover時の自由検索語（getStatsList searchWord）"
        required: false
        default: ""
      test_deploy_hook:
        description: "true なら Cloudflare Deploy Hook の疎通テストのみ（データ生成は行わない）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: update-foreign-residents
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 依存なし（urllib/json の標準ライブラリのみ）。appId はコード直書きせず Secrets から。
      - name: Generate data from e-Stat API
        if: ${{ github.event.inputs.test_deploy_hook != 'true' }}
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          ZAIRYU_STATS_ID: ${{ github.event.inputs.zairyu_stats_id }}
          POP_STATS_ID: ${{ github.event.inputs.pop_stats_id }}
          DISCOVER_QUERY: ${{ github.event.inputs.query }}
        run: |
          if [ "${{ github.event.inputs.discover }}" = "true" ]; then
            python build_data.py --discover
          else
            python build_data.py
          fi

      # 生成物を成果物として保存（コミット有無に関わらず中身を確認できるように）
      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population_json
          path: data/population.json
          if-no-files-found: ignore

      - name: Commit if changed
        env:
          # Cloudflare Pages の Deploy Hook URL（秘密情報）。Secret 経由で参照し、コードに直書きしない。
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/population.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update prefecture population data ($(date +%Y-%m-%d))"
            git push
            # データが更新された時だけ Cloudflare Pages をリビルドし seiji-mieru.com/zairyu/ に反映。
            # Secret 未設定なら空振り（URL はログに出さない）。
            if [ -n "${CF_DEPLOY_HOOK_URL:-}" ]; then
              curl -fsS -X POST "$CF_DEPLOY_HOOK_URL" > /dev/null && echo "Cloudflare rebuild triggered"
            else
              echo "CF_DEPLOY_HOOK_URL 未設定 → リビルドはスキップ"
            fi
          fi

      # --- 一時的な疎通テスト用（確認後に削除する） ---
      - name: Test Cloudflare deploy hook (manual)
        if: ${{ github.event.inputs.test_deploy_hook == 'true' }}
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${CF_DEPLOY_HOOK_URL:-}" ]; then echo "CF_DEPLOY_HOOK_URL 未設定"; exit 1; fi
          curl -fsS -X POST "$CF_DEPLOY_HOOK_URL" > /dev/null && echo "✓ Cloudflare rebuild triggered (test)"
